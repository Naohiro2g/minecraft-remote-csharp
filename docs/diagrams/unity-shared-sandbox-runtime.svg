<svg xmlns="http://www.w3.org/2000/svg" width="1360" height="900" viewBox="0 0 1360 900" role="img" aria-labelledby="title desc">
<title id="title">箱庭サーバーとUnity Webの実装形態</title>
<desc id="desc">サーバーは描画なしの.NET実行アプリ、クライアントはブラウザで動くUnity WebAssembly。WebコンテンツをHTTP配信し、表示同期にはWSまたはWSSを使う。公開、LAN、PC1台で同じ実装を使う案。</desc>
<defs>
<marker id="arrowBlue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10Z" fill="#2563eb"/></marker>
<marker id="arrowGreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10Z" fill="#047857"/></marker>
</defs>
<rect width="1360" height="900" fill="#f8fafc"/>
<g font-family="Noto Sans CJK JP, sans-serif" fill="#172033">
<text x="40" y="51" font-size="29" font-weight="700">箱庭サーバーとUnity Web：実行場所と成果物（案）</text>
<text x="40" y="85" font-size="17" fill="#475569">公開・LAN内・PC1台で、同じサーバー実装とUnity Webのbuild成果物を使う</text>

<rect x="40" y="115" width="590" height="570" rx="16" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
<text x="65" y="151" font-size="23" font-weight="700">サーバー側：描画なしの.NETプロセス</text>
<rect x="65" y="178" width="540" height="80" rx="10" fill="white" stroke="#94a3b8"/>
<text x="85" y="208" font-size="19" font-weight="700">HTTP：Webコンテンツの配信</text>
<text x="85" y="238" font-size="16">入口HTML / JavaScript / Unity build / 実行時設定</text>
<rect x="65" y="287" width="540" height="80" rx="10" fill="white" stroke="#94a3b8"/>
<text x="85" y="317" font-size="19" font-weight="700">TCP：McRemote接続口</text>
<text x="85" y="347" font-size="16">Bridge / Python / C# から要求を受ける</text>
<rect x="65" y="403" width="540" height="103" rx="10" fill="#172b4d" stroke="#172b4d"/>
<text x="85" y="437" font-size="21" font-weight="700" fill="white">共有世界のモデル</text>
<text x="85" y="468" font-size="16" fill="white">4建築操作 / 地面 / block状態 / reset / 接続とorigin</text>
<text x="85" y="492" font-size="15" fill="#cbd5e1">Unityの描画部品は持たない</text>
<rect x="65" y="543" width="540" height="80" rx="10" fill="white" stroke="#047857"/>
<text x="85" y="573" font-size="19" font-weight="700">WS / WSS：表示同期</text>
<text x="85" y="603" font-size="16">参加時の初期状態 / 更新 / 再接続 / reset</text>
<path d="M335 367 V398" fill="none" stroke="#2563eb" stroke-width="3" marker-end="url(#arrowBlue)"/>
<path d="M335 506 V538" fill="none" stroke="#047857" stroke-width="3" marker-end="url(#arrowGreen)"/>
<text x="65" y="658" font-size="16" fill="#475569">OS / CPU別の実行モジュールを配布する</text>

<rect x="760" y="115" width="560" height="570" rx="16" fill="#ecfdf5" stroke="#047857" stroke-width="2"/>
<text x="785" y="151" font-size="23" font-weight="700">クライアント側：参加者のブラウザ</text>
<rect x="785" y="178" width="510" height="80" rx="10" fill="white" stroke="#94a3b8"/>
<text x="805" y="208" font-size="19" font-weight="700">入口HTML / JavaScript</text>
<text x="805" y="238" font-size="16">読み込み・入場・案内・実行時設定</text>
<rect x="785" y="303" width="510" height="178" rx="10" fill="#047857"/>
<text x="805" y="340" font-size="22" font-weight="700" fill="white">Unity WebAssembly</text>
<text x="805" y="375" font-size="17" fill="white">ブロック描画 / 移動・視点 / 足と照準のHUD</text>
<text x="805" y="406" font-size="17" fill="white">後続の手作業による設置・破壊</text>
<text x="805" y="448" font-size="16" fill="#d1fae5">.wasm / .framework.js / .data</text>
<rect x="785" y="543" width="510" height="80" rx="10" fill="white" stroke="#047857"/>
<text x="805" y="573" font-size="19" font-weight="700">表示同期adapter</text>
<text x="805" y="603" font-size="16">JavaScriptとUnity C#をつなぐ</text>
<path d="M1040 258 V298" fill="none" stroke="#2563eb" stroke-width="3" marker-end="url(#arrowBlue)"/>
<path d="M1040 543 V486" fill="none" stroke="#047857" stroke-width="3" marker-end="url(#arrowGreen)"/>
<text x="785" y="658" font-size="16" fill="#475569">表示する人のPCにUnity Editor / SDKは不要</text>

<path d="M605 218 H780" fill="none" stroke="#2563eb" stroke-width="3" marker-end="url(#arrowBlue)"/>
<text x="692" y="202" text-anchor="middle" font-size="16" fill="#2563eb">HTTP(S)</text>
<path d="M605 584 H780" fill="none" stroke="#047857" stroke-width="3" marker-end="url(#arrowGreen)"/>
<text x="692" y="565" text-anchor="middle" font-size="16" fill="#047857">WS(S)</text>

<rect x="40" y="726" width="1280" height="127" rx="12" fill="white" stroke="#cbd5e1"/>
<text x="61" y="758" font-size="18" font-weight="700">共通にするもの</text>
<text x="61" y="790" font-size="17">世界・建築命令・Unity Web build成果物。環境ごとに変えるのは接続先・待受範囲・TLS・起動方法など。</text>
<text x="61" y="822" font-size="16" fill="#475569">既存Scratch / Bridgeは別の成果物として再利用。契約・案内・配布設定への追従要否は文書の影響表で確認する。</text>
</g>
</svg>
