<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="580" viewBox="0 0 1280 580" role="img" aria-labelledby="title description">
<title id="title">Unity公開共有箱庭の接続図</title>
<desc id="description">ScratchはBridgeを介し、PythonとC#は直接TCPで共有箱庭サーバーへ接続する。各ブラウザのUnity Webは自分からWSS接続し、共有状態を受け取って描画する構成案。</desc>
<defs>
<marker id="blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#2563eb"/></marker>
<marker id="green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#047857"/></marker>
</defs>
<rect width="1280" height="580" fill="#f8fafc"/>
<g font-family="Noto Sans CJK JP, sans-serif" fill="#172033">
<text x="40" y="52" font-size="29" font-weight="700">Unity公開共有箱庭：接続図（構成案）</text>
<text x="40" y="86" font-size="17" fill="#475569">世界の状態は公開サーバーで共有し、描画は各参加者のブラウザで行う</text>
<rect x="40" y="120" width="190" height="78" rx="12" fill="#fff7ed" stroke="#c2410c" stroke-width="2"/>
<text x="135" y="154" text-anchor="middle" font-size="23" font-weight="700">Scratch</text>
<text x="135" y="180" text-anchor="middle" font-size="15">建築コードを実行</text>
<rect x="310" y="120" width="170" height="78" rx="12" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
<text x="395" y="154" text-anchor="middle" font-size="23" font-weight="700">Bridge</text>
<text x="395" y="180" text-anchor="middle" font-size="15">WSS と TCP を接続</text>
<path d="M230 159 H305" fill="none" stroke="#2563eb" stroke-width="3" marker-end="url(#blue)"/>
<text x="267" y="143" text-anchor="middle" font-size="16" fill="#1d4ed8">WSS</text>
<rect x="40" y="292" width="440" height="82" rx="12" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
<text x="260" y="327" text-anchor="middle" font-size="23" font-weight="700">Python / C#</text>
<text x="260" y="354" text-anchor="middle" font-size="16">PCなどで動くclient・TCPを学ぶ入口</text>
<path d="M480 159 H540 V245 H595" fill="none" stroke="#2563eb" stroke-width="3" marker-end="url(#blue)"/>
<text x="540" y="143" text-anchor="middle" font-size="16" fill="#1d4ed8">TCP</text>
<path d="M480 333 H595" fill="none" stroke="#2563eb" stroke-width="3" marker-end="url(#blue)"/>
<text x="535" y="317" text-anchor="middle" font-size="16" fill="#1d4ed8">TCP</text>
<rect x="600" y="180" width="280" height="220" rx="16" fill="#172b4d" stroke="#172b4d" stroke-width="2"/>
<g fill="#ffffff" text-anchor="middle">
<text x="740" y="224" font-size="24" font-weight="700">公開箱庭サーバー</text>
<text x="740" y="267" font-size="19">建築要求の受付</text>
<text x="740" y="299" font-size="19">共有ブロックの状態</text>
<text x="740" y="331" font-size="19">読み取り・チャット</text>
<text x="740" y="371" font-size="16" fill="#cbd5e1">初期状態・更新・リセット</text>
</g>
<rect x="1000" y="135" width="230" height="90" rx="12" fill="#ecfdf5" stroke="#047857" stroke-width="2"/>
<text x="1115" y="171" text-anchor="middle" font-size="23" font-weight="700">Unity Web A</text>
<text x="1115" y="199" text-anchor="middle" font-size="16">参加者Aのブラウザ</text>
<rect x="1000" y="305" width="230" height="90" rx="12" fill="#ecfdf5" stroke="#047857" stroke-width="2"/>
<text x="1115" y="341" text-anchor="middle" font-size="23" font-weight="700">Unity Web B</text>
<text x="1115" y="369" text-anchor="middle" font-size="16">参加者Bのブラウザ</text>
<path d="M880 245 H940 V180 H995" fill="none" stroke="#047857" stroke-width="3" marker-end="url(#green)"/>
<path d="M880 333 H950 V350 H995" fill="none" stroke="#047857" stroke-width="3" marker-end="url(#green)"/>
<text x="940" y="124" text-anchor="middle" font-size="17" fill="#047857">WSS</text>
<text x="940" y="290" text-anchor="middle" font-size="17" fill="#047857">表示同期</text>
<text x="1115" y="433" text-anchor="middle" font-size="17" fill="#047857">同じ箱庭を見る</text>
<rect x="40" y="466" width="1190" height="82" rx="10" fill="#ffffff" stroke="#cbd5e1"/>
<text x="58" y="495" font-size="16">矢印は要求・更新の主な流れ。建築要求には応答が戻る。</text>
<text x="58" y="523" font-size="16">Unity WebのWSS接続は各ブラウザ側から開始する。建築命令と表示同期の契約は分けて設計する。</text>
</g>
</svg>
