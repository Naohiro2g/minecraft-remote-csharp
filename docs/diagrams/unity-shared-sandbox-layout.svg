<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="740" viewBox="0 0 1100 740" role="img" aria-labelledby="title description">
  <title id="title">400×400の世界と100×100の9区画の配置例</title>
  <desc id="description">400×400の世界に100×100区画0〜8を配置する案。中央区画4が世界原点(0,0,0)。Unityの導入用originは区画8の(100,0,100)。地面ブロックy62、足y63。</desc>
  <defs>
    <pattern id="grid" patternUnits="userSpaceOnUse" width="12" height="12" x="140" y="210">
      <path d="M12 0 H0 V12" fill="none" stroke="#15803d" stroke-width=".6" />
    </pattern>
  </defs>
  <rect width="1100" height="740" fill="#f8fafc" />
  <g font-family="Noto Sans CJK JP, sans-serif" fill="#172033">
    <text x="35" y="48" font-size="28" font-weight="700">400×400の世界と9区画：上から見た配置例</text>
    <text x="35" y="79" font-size="16" fill="#475569">この図の配置は案。区画の専有・予約や、参加人数の制限を意味しない。</text>
    <path d="M80 116 H560 M80 108 V124 M560 108 V124" fill="none" stroke="#334155" stroke-width="2" />
    <text x="320" y="108" text-anchor="middle" font-size="18">400 blocks</text>
    <rect x="80" y="150" width="480" height="480" fill="#f0fdf4" stroke="#172b4d" stroke-width="3" />
    <rect x="140" y="210" width="120" height="120" fill="#bbf7d0" stroke="#166534" stroke-width="2" />
    <rect x="140" y="210" width="120" height="120" fill="url(#grid)" opacity=".35" />
    <text x="200" y="240" text-anchor="middle" font-size="25" font-weight="700">区画 0</text>
    <text x="200" y="315" text-anchor="middle" font-size="15">100 × 100</text>
    <rect x="260" y="210" width="120" height="120" fill="#dcfce7" stroke="#166534" stroke-width="2" />
    <rect x="260" y="210" width="120" height="120" fill="url(#grid)" opacity=".35" />
    <text x="320" y="240" text-anchor="middle" font-size="25" font-weight="700">区画 1</text>
    <text x="320" y="315" text-anchor="middle" font-size="15">100 × 100</text>
    <rect x="380" y="210" width="120" height="120" fill="#bbf7d0" stroke="#166534" stroke-width="2" />
    <rect x="380" y="210" width="120" height="120" fill="url(#grid)" opacity=".35" />
    <text x="440" y="240" text-anchor="middle" font-size="25" font-weight="700">区画 2</text>
    <text x="440" y="315" text-anchor="middle" font-size="15">100 × 100</text>
    <rect x="140" y="330" width="120" height="120" fill="#dcfce7" stroke="#166534" stroke-width="2" />
    <rect x="140" y="330" width="120" height="120" fill="url(#grid)" opacity=".35" />
    <text x="200" y="360" text-anchor="middle" font-size="25" font-weight="700">区画 3</text>
    <text x="200" y="435" text-anchor="middle" font-size="15">100 × 100</text>
    <rect x="260" y="330" width="120" height="120" fill="#fef3c7" stroke="#b45309" stroke-width="3" />
    <rect x="260" y="330" width="120" height="120" fill="url(#grid)" opacity=".35" />
    <text x="320" y="360" text-anchor="middle" font-size="25" font-weight="700">区画 4</text>
    <text x="320" y="435" text-anchor="middle" font-size="15">100 × 100</text>
    <rect x="380" y="330" width="120" height="120" fill="#dcfce7" stroke="#166534" stroke-width="2" />
    <rect x="380" y="330" width="120" height="120" fill="url(#grid)" opacity=".35" />
    <text x="440" y="360" text-anchor="middle" font-size="25" font-weight="700">区画 5</text>
    <text x="440" y="435" text-anchor="middle" font-size="15">100 × 100</text>
    <rect x="140" y="450" width="120" height="120" fill="#bbf7d0" stroke="#166534" stroke-width="2" />
    <rect x="140" y="450" width="120" height="120" fill="url(#grid)" opacity=".35" />
    <text x="200" y="480" text-anchor="middle" font-size="25" font-weight="700">区画 6</text>
    <text x="200" y="555" text-anchor="middle" font-size="15">100 × 100</text>
    <rect x="260" y="450" width="120" height="120" fill="#dcfce7" stroke="#166534" stroke-width="2" />
    <rect x="260" y="450" width="120" height="120" fill="url(#grid)" opacity=".35" />
    <text x="320" y="480" text-anchor="middle" font-size="25" font-weight="700">区画 7</text>
    <text x="320" y="555" text-anchor="middle" font-size="15">100 × 100</text>
    <rect x="380" y="450" width="120" height="120" fill="#dbeafe" stroke="#2563eb" stroke-width="3" />
    <rect x="380" y="450" width="120" height="120" fill="url(#grid)" opacity=".35" />
    <text x="440" y="480" text-anchor="middle" font-size="25" font-weight="700">区画 8</text>
    <text x="440" y="555" text-anchor="middle" font-size="15">100 × 100</text>
    <text x="80" y="143" text-anchor="middle" font-size="14">-200</text>
    <text x="140" y="143" text-anchor="middle" font-size="14">-150</text>
    <text x="260" y="143" text-anchor="middle" font-size="14">-50</text>
    <text x="380" y="143" text-anchor="middle" font-size="14">50</text>
    <text x="500" y="143" text-anchor="middle" font-size="14">150</text>
    <text x="560" y="143" text-anchor="middle" font-size="14">200</text>
    <text x="60" y="157" text-anchor="end" font-size="14">-200</text>
    <text x="60" y="216" text-anchor="end" font-size="14">-150</text>
    <text x="60" y="336" text-anchor="end" font-size="14">-50</text>
    <text x="60" y="456" text-anchor="end" font-size="14">50</text>
    <text x="60" y="576" text-anchor="end" font-size="14">150</text>
    <text x="60" y="636" text-anchor="end" font-size="14">200</text>
    <text x="320" y="190" text-anchor="middle" font-size="18" fill="#166534">外周 50</text>
    <text x="320" y="608" text-anchor="middle" font-size="18" fill="#166534">外周 50</text>
    <text x="320" y="665" text-anchor="middle" font-size="17">区画部分：300 × 300 ／ xは右、zは下</text>
    <rect x="635" y="140" width="425" height="254" rx="12" fill="#ffffff" stroke="#cbd5e1" />
    <text x="658" y="176" font-size="23" font-weight="700">座標と配置の例</text>
    <text x="658" y="215" font-size="17">世界の整数セル：x,z = -200..199</text>
    <text x="658" y="247" font-size="17">区画の各軸：</text>
    <text x="678" y="278" font-size="16">-150..-51 / -50..49 / 50..149</text>
    <text x="658" y="318" font-size="17">中央区画4：世界原点 (0,0,0)</text>
    <text x="658" y="350" font-size="16">導入の原点：区画8 (100,0,100)</text>
    <text x="658" y="378" font-size="14" fill="#64748b">図中の細線は10ブロックごとの目安</text>
    <rect x="635" y="417" width="425" height="248" rx="12" fill="#ffffff" stroke="#cbd5e1" />
    <text x="658" y="455" font-size="23" font-weight="700">高さ：地上と床ブロック</text>
    <text x="658" y="494" font-size="17">足の高さ：Y_GROUND = 63</text>
    <path d="M660 520 H1035" stroke="#334155" stroke-width="3" />
    <text x="1018" y="512" text-anchor="end" font-size="16" fill="#475569">地面の上面</text>
    <rect x="670" y="523" width="350" height="58" fill="#86b758" stroke="#3f6212" />
    <text x="845" y="560" text-anchor="middle" font-size="19">草ブロックの座標：y = 62</text>
    <text x="658" y="615" font-size="17">Y_SEA = 62 は参照する海面の値</text>
    <text x="658" y="644" font-size="15" fill="#64748b">海の配置や保護地面の範囲は未決</text>
    <text x="35" y="714" font-size="16" fill="#475569">指定：9区画の建築原点。図の案：各原点を区画中央とし、外周に50ずつ残す。</text>
    <circle cx="200" cy="270" r="4" fill="#172b4d" />
    <text x="200" y="293" text-anchor="middle" font-size="11.5" fill="#334155">(-100,0,-100)</text>
    <circle cx="320" cy="270" r="4" fill="#172b4d" />
    <text x="320" y="293" text-anchor="middle" font-size="11.5" fill="#334155">(0,0,-100)</text>
    <circle cx="440" cy="270" r="4" fill="#172b4d" />
    <text x="440" y="293" text-anchor="middle" font-size="11.5" fill="#334155">(100,0,-100)</text>
    <circle cx="200" cy="390" r="4" fill="#172b4d" />
    <text x="200" y="413" text-anchor="middle" font-size="11.5" fill="#334155">(-100,0,0)</text>
    <circle cx="320" cy="390" r="4" fill="#172b4d" />
    <text x="320" y="413" text-anchor="middle" font-size="11.5" fill="#334155">(0,0,0)</text>
    <circle cx="440" cy="390" r="4" fill="#172b4d" />
    <text x="440" y="413" text-anchor="middle" font-size="11.5" fill="#334155">(100,0,0)</text>
    <circle cx="200" cy="510" r="4" fill="#172b4d" />
    <text x="200" y="533" text-anchor="middle" font-size="11.5" fill="#334155">(-100,0,100)</text>
    <circle cx="320" cy="510" r="4" fill="#172b4d" />
    <text x="320" y="533" text-anchor="middle" font-size="11.5" fill="#334155">(0,0,100)</text>
    <circle cx="440" cy="510" r="4" fill="#1d4ed8" />
    <text x="440" y="533" text-anchor="middle" font-size="11.5" fill="#334155">(100,0,100)</text>
  </g>
</svg>
